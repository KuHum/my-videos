<template>
<!-- ==========================================================================
     wall.html — 37.388-41.933 s (host-local clock)
     Hangzhou keeps playing (same source clock as the pill) as the camera
     pulls back from 4x to 0.62x and reveals it at the center of a wall nine
     tiles wide and seven high (480x270 tiles, centers 516 px apart
     horizontally, 306 vertically, perspective 1600 px). The wall tilts
     50 deg around X and -14 deg around Z as it is revealed; a ripple of
     light spreads from the center at 39.658 s; at 40.683 s the camera
     dives toward the tile two places right in the same row (Shanghai,
     p129 already playing there since 40.533 s).
     ========================================================================== -->
<style>
  #root {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #03060d;
    -webkit-font-smoothing: antialiased;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("assets/fonts/Montserrat.ttf") format("truetype-variations");
    font-weight: 100 900;
    font-style: normal;
  }
  @font-face {
    font-family: "DM Mono";
    src: url("assets/fonts/DMMono-Medium.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }

  #w-linecopy {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    opacity: 1;
  }
  #w-open2 {
    position: absolute;
    left: 0;
    top: 445px;
    line-height: 110px;
    white-space: nowrap;

    font-size: 110px;

    text-shadow: 0 2px 30px rgba(3, 6, 13, 0.65);
  }
  #w-every2 {
    position: absolute;
    left: 0;
    top: 468px;
    line-height: 64px;
    white-space: nowrap;
    font-family: "Montserrat", sans-serif;
    font-weight: 600;
    font-size: 64px;
    color: #ffffff;
    text-shadow: 0 2px 26px rgba(3, 6, 13, 0.75);
  }

  #w-stage {
    position: absolute;
    inset: 0;
    z-index: 10;
    perspective: 1600px;
    perspective-origin: 960px 540px;
  }
  #w-wall {
    position: absolute;
    left: -1362px;
    top: -531px;
    width: 4644px;
    height: 2142px;
    transform-origin: 50% 50%;
  }
  .w-tile {
    position: absolute;
    width: 480px;

    background-size: cover;

  }
  .w-tile video {
    position: absolute;
    inset: 0;

    height: 100%;
    object-fit: cover;
  }

  #w-ripple {
    position: absolute;
    left: 2172px;
    top: 921px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 4px solid rgba(159, 196, 255, 0.9);
    box-shadow: 0 0 70px rgba(127, 164, 255, 0.55), inset 0 0 70px rgba(127, 164, 255, 0.35);
    opacity: 0;
  }

  #w-hz {
    position: absolute;
    left: 0;
    top: 654px;
    width: 1920px;
    text-align: center;
    z-index: 30;
    font-family: "DM Mono", monospace;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: #e8eef9;
    text-shadow: 0 2px 26px rgba(3, 6, 13, 0.8);
    opacity: 0;
  }
</style>

<div id="root" data-composition-id="wall" data-width="1920" data-height="1080">
  <div id="w-linecopy" data-layout-ignore="true">
    <span id="w-open2" data-var-text="openTo">Open to</span>
    <span id="w-every2" data-var-text="aud4">everyone.</span>
  </div>

  <div id="w-stage" data-layout-allow-overflow="true">
    <div id="w-wall">
      <!-- the 63 tiles are generated by script from the 32 wall stills;
           the moving Hangzhou and Shanghai trims are real timed clips -->
      <div class="w-tile" id="w-t-3-4">
        <video id="w-hangzhou" class="clip" data-start="0" data-duration="4.545" data-media-start="2.273" data-track-index="1" muted playsinline src="assets/media/p176.mp4"></video>
      </div>
      <div class="w-tile" id="w-t-3-6">
        <video id="w-shanghai" class="clip" data-start="3.145" data-duration="1.4" data-media-start="0" data-track-index="2" muted playsinline src="assets/media/p129.mp4"></video>
      </div>
      <div id="w-ripple" data-layout-ignore="true"></div>
    </div>
  </div>

  <div id="w-hz" data-var-text="cityLabel">HANGZHOU · EST. 2023</div>
</div>

<script>
  {
    // 32 stills in ascending id order; tile (r, c) uses index (5r + 3c) % 32
    const STILL_IDS = [
      "p000", "p002", "p003", "p012", "p019", "p025", "p029", "p034",
      "p038", "p042", "p053", "p055", "p059", "p064", "p083", "p087",
      "p089", "p097", "p098", "p114", "p121", "p129", "p131", "p139",
      "p151", "p164", "p169", "p176", "p194", "p201", "p208", "p223",
    ];
    const COLS = 9;
    const ROWS = 7;
    const DX = 516;
    const DY = 306;
    const CENTER_R = 3;
    const CENTER_C = 4;
    const TARGET_C = 6;
    const TARGET_DX = (TARGET_C - CENTER_C) * DX; // 1032 px to the right

    const PULL_END = 2.27; // 39.658 s: ripple starts, hold begins
    const DIVE_START = 3.295; // 40.683 s
    const SCENE_END = 4.545; // 41.933 s

    const measureCtx = document.createElement("canvas").getContext("2d");

    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const easeInOut = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
    const easeOut = (p) => 1 - Math.pow(1 - p, 3);
    const easeIn = (p) => p * p * p;

    function build() {
      // ---- the still tiles -------------------------------------------
      const wall = document.getElementById("w-wall");
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if ((r === CENTER_R && c === CENTER_C) || (r === CENTER_R && c === TARGET_C)) {
            continue; // the two moving tiles already exist in the markup
          }
          const tile = document.createElement("div");
          tile.className = "w-tile";
          const id = STILL_IDS[(5 * r + 3 * c) % 32];
          tile.style.left = 2322 + (c - CENTER_C) * DX - 240 + "px";
          tile.style.top = 1071 + (r - CENTER_R) * DY - 135 + "px";
          tile.style.backgroundImage = "url(assets/stills/" + id + ".jpg)";
          wall.appendChild(tile);
        }
      }

      // ---- the "Open to everyone." line, same layout as the pill end --
      const openEl = document.getElementById("w-open2");
      const everyEl = document.getElementById("w-every2");
      const GAP = 32;
      measureCtx.font = '600 110px "Montserrat"';
      const wOpen = measureCtx.measureText(openEl.textContent).width;
      measureCtx.font = '600 64px "Montserrat"';
      const wEvery = measureCtx.measureText(everyEl.textContent).width;
      const total = wOpen + GAP + wEvery;
      gsap.set(openEl, { x: 960 - total / 2 });
      gsap.set(everyEl, { x: 960 - total / 2 + wOpen + GAP });

      // ---- camera + overlays as pure functions of scene time ---------
      const wallEl = document.getElementById("w-wall");
      const ripple = document.getElementById("w-ripple");
      const hz = document.getElementById("w-hz");
      const linecopy = document.getElementById("w-linecopy");

      const render = (t) => {
        // camera: pull back 4x -> 0.62x, hold, dive into the target tile
        let scale, tilt, fx;
        if (t < PULL_END) {
          const k = easeInOut(t / PULL_END);
          scale = 4 + (0.62 - 4) * k;
          tilt = k;
          fx = 0;
        } else if (t < DIVE_START) {
          scale = 0.62;
          tilt = 1;
          fx = 0;
        } else {
          const k = easeIn((t - DIVE_START) / (SCENE_END - DIVE_START));
          scale = 0.62 + (4 - 0.62) * k;
          tilt = 1 - k;
          fx = TARGET_DX * k;
        }
        wallEl.style.transform =
          "rotateX(" + 50 * tilt + "deg) rotateZ(" + -14 * tilt + "deg) scale(" + scale +
          ") translate(" + -fx + "px, 0px)";

        // ripple of light spreading from the center at 39.658 s
        const rk = clamp01((t - PULL_END) / 1.3);
        if (rk <= 0) {
          ripple.style.opacity = 0;
        } else {
          ripple.style.opacity = 0.9 * (1 - rk) * (1 - rk);
          ripple.style.transform = "scale(" + (0.15 + 9 * easeOut(rk)) + ")";
        }

        // the audience line leaves as the city settles into its tile
        const lk = clamp01((t - 1.9) / 0.4);
        linecopy.style.opacity = 1 - lk;

        // HANGZHOU - EST. 2023 below the center tile
        let ho = 0;
        if (t >= 1.6) ho = clamp01((t - 1.6) / 0.3);
        if (t >= DIVE_START) ho = 1 - clamp01((t - DIVE_START) / 0.25);
        hz.style.opacity = ho;
      };
      render(0);

      const tl = gsap.timeline({ paused: true });
      const driver = { p: 0 };
      tl.to(
        driver,
        {
          p: 1,
          duration: SCENE_END,
          ease: "none",
          onUpdate: () => render(driver.p * SCENE_END),
        },
        0,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["wall"] = tl;
    }

    Promise.all([
      document.fonts.load('600 110px "Montserrat"'),
      document.fonts.load('500 38px "DM Mono"'),
    ]).then(build);
  }
</script>
</template>
