      <clipPath id="iClip2" clipPathUnits="userSpaceOnUse"><text id="iClipT2" x="0" y="700" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="440px">P</text></clipPath>
      <clipPath id="iClip3" clipPathUnits="userSpaceOnUse"><text id="iClipT3" x="0" y="700" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="440px">O</text></clipPath>
    </defs>
  </svg>

  <video id="i-bg" class="clip" data-start="0" data-duration="4.546" data-track-index="1" muted playsinline src="assets/media/p129.mp4" style="z-index: 1"></video>
  <div id="i-scrim" data-layout-ignore="true"></div>

  <!-- the white DeepSeek wordmark wipes on above the skyline -->
  <img id="i-mark" class="clip" data-start="0.07" data-duration="4.476" data-track-index="2" src="assets/brand/deepseek-wordmark-white.svg" alt="DeepSeek" />

  <!-- a line traces upward to the right through 41 points -->
  <svg id="i-chart" class="clip" data-start="0.47" data-duration="4.076" data-track-index="3" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" data-layout-ignore="true">
    <polyline id="i-line" stroke="#7fa4ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </svg>

  <!-- I P O: each letter a window onto a second city-light shot -->
  <div id="i-block">
    <div class="i-letter" id="i-lw1">
      <video id="i-fill-i" class="clip" data-start="1.117" data-duration="3.427" data-track-index="4" muted playsinline src="assets/media/p131.mp4"></video>
      <div class="i-glyph" id="i-g1">I</div>
    </div>
    <div class="i-letter" id="i-lw2">
      <video id="i-fill-p" class="clip" data-start="1.117" data-duration="3.428" data-track-index="4" muted playsinline src="assets/media/p131.mp4"></video>
      <div class="i-glyph" id="i-g2">P</div>
    </div>
    <div class="i-letter" id="i-lw3">

      <div class="i-glyph" id="i-g3">O</div>

  <div id="i-typeline" data-var-text="typed2">Answer the essential question with long-termism.</div>

  <div id="i-flash" data-layout-ignore="true"></div>

<script>
  {
    const BASELINE = 700;
    const LETTER_GAP = 64;
    const TYPE_START = 2.817; // 44.75 s on the film clock
    const CPS = 33;

    const measureCtx = document.createElement("canvas").getContext("2d");

    // seeded PRNG for the chart wobble (no Math.random)
    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function build() {
      // ---- letter positions: I, P, O centered on the frame ----------
      measureCtx.font = '900 440px "Montserrat"';
      const glyphs = ["I", "P", "O"];
      const widths = glyphs.map((g) => measureCtx.measureText(g).width);
      const metrics = measureCtx.measureText("IPO");
      const ascent = metrics.fontBoundingBoxAscent;
      const descent = metrics.fontBoundingBoxDescent;
      const total = widths.reduce((a, b) => a + b, 0) + 2 * LETTER_GAP;
      let cursor = 960 - total / 2;
      const boxes = glyphs.map((g, i) => {
        const left = cursor;
        cursor += widths[i] + (i < 2 ? LETTER_GAP : 0);
        return { glyph: g, left, width: widths[i], center: left + widths[i] / 2 };
      });

      // DOM glyph tops: land the baseline of each 440 px line at BASELINE
      const lineHeight = 440;
      const baselineTop = (lineHeight - (ascent + descent)) / 2 + ascent;
      boxes.forEach((b, i) => {
        const glyphEl = document.getElementById("i-g" + (i + 1));
        glyphEl.style.left = b.left + "px";
        glyphEl.style.top = BASELINE - baselineTop + "px";
        document.getElementById("iClipT" + (i + 1)).setAttribute("x", b.center);
      });
      document.querySelectorAll(".i-letter").forEach((el, i) => {
        el.style.clipPath = "url(#iClip" + (i + 1) + ")";
      });

      const tl = gsap.timeline({ paused: true });

      // the white wordmark wipes on
      tl.fromTo(
        "#i-mark",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.inOut" },
        0.07,
      );

      // the rising line through 41 points, drawn behind the letters
      const rand = mulberry32(7);
      const points = [];
      for (let i = 0; i < 41; i++) {
        const x = 240 + i * 36;
        const y = 880 - i * 10.5 + (rand() - 0.5) * 26;
        points.push(x + "," + y);
      }
      const line = document.getElementById("i-line");
      line.setAttribute("points", points.join(" "));
      const lineLength = line.getTotalLength();
      line.style.strokeDasharray = lineLength;
      line.style.strokeDashoffset = lineLength;
      tl.fromTo("#i-chart", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.47);
      tl.to(line, { strokeDashoffset: 0, duration: 2.1, ease: "power1.inOut" }, 0.47);

      // the three letters rise at 43.05 / 43.47 / 43.90 s
      [0, 1, 2].forEach((i) => {
        tl.fromTo(
          "#i-lw" + (i + 1),
          { y: 150, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.117 + i * 0.42,
        );
      });

      // the second typed line, 33 characters per second
      const typeLine = document.getElementById("i-typeline");
      const text = typeLine.textContent;
      const advance = (measureCtx.font = '400 40px "DM Mono"', measureCtx.measureText("M").width);
      const typeWidth = measureCtx.measureText(text).width;
      const typeLeft = 960 - typeWidth / 2;
      const spans = [];
      for (const ch of text) {
        const span = document.createElement("span");
        span.className = ch === " " ? "ch-sp" : "ch";
        if (ch !== " ") span.textContent = ch;
        typeLine.appendChild(span);
        spans.push(span);
      }
      gsap.set(typeLine, { x: typeLeft });
      spans.forEach((span, i) => {
        const at = TYPE_START + i / CPS;
        tl.set(span, { opacity: 1 }, at);
        tl.set("#i-dot", { opacity: 1, x: typeLeft + (i + 1) * advance + 14 }, at);
      });
      tl.to("#i-dot", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.2);

      // in the final 0.55 s the letters enlarge toward the camera
      tl.fromTo(
        "#i-block",
        { scale: 1 },
        { scale: 1.32, duration: 0.55, ease: "power2.in", transformOrigin: "50% 46%" },
        3.996,
      );

      // a cool white flash takes the image into the end card
      tl.to("#i-flash", { opacity: 1, duration: 0.15, ease: "power2.in" }, 4.396);

      window.__timelines = window.__timelines || {};
      window.__timelines["ipo"] = tl;
    }

    Promise.all([
      document.fonts.load('900 440px "Montserrat"'),
      document.fonts.load('400 40px "DM Mono"'),
    ]).then(build);
  }
</script>
