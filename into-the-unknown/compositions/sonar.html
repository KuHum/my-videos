<script>
  {
    // per-shot focal point (fractions of the square) and base zoom
    const SHOTS = [
      { fx: 0.7, fy: 0.52, z: 1.55 },
      { fx: 0.44, fy: 0.45, z: 1.15 },
      { fx: 0.3, fy: 0.66, z: 1.35 },
      { fx: 0.66, fy: 0.4, z: 1.35 },
      { fx: 0.5, fy: 0.52, z: 1.15 },
      { fx: 0.58, fy: 0.62, z: 1.25 },
      { fx: 0.5, fy: 0.5, z: 1.1 },
      { fx: 0.5, fy: 0.58, z: 1.2 },
      { fx: 0.38, fy: 0.42, z: 1.55 },
    ];
    const CUT = 0.909091; // two beats at 132 BPM

    function build() {
      const tl = gsap.timeline({ paused: true });

      // 72 tick marks
      const ticks = document.getElementById("s-ticks");
      for (let i = 0; i < 72; i++) {
        const angle = (i / 72) * Math.PI * 2;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const r0 = 324;
        const r1 = 336;
        line.setAttribute("x1", 380 + r0 * Math.cos(angle));
        line.setAttribute("y1", 380 + r0 * Math.sin(angle));
        line.setAttribute("x2", 380 + r1 * Math.cos(angle));
        line.setAttribute("y2", 380 + r1 * Math.sin(angle));
        line.setAttribute("stroke", "rgba(232,238,249,0.8)");
        line.setAttribute("stroke-width", "2");
        ticks.appendChild(line);
      }

      // the window expands from the dot on the downbeat
      gsap.set("#s-pop", { scale: 1 });
      tl.fromTo("#s-circle", { scale: 0.035 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0);
      // the cool white flash decays
      tl.fromTo("#s-flash", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, 0);
      // rings and outlined words arrive with the window
      tl.fromTo("#s-rings", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.08);
      tl.fromTo(
        "#s-words",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power2.out" },
        0.25,
      );

      // dashed ring clockwise, tick marks counterclockwise, progress one turn
      tl.to("#s-dashring", { rotation: 360, svgOrigin: "380 380", duration: 8.182, ease: "none" }, 0);
      tl.to("#s-ticks", { rotation: -180, svgOrigin: "380 380", duration: 8.182, ease: "none" }, 0);
      tl.to("#s-progress", { strokeDashoffset: 0, duration: 8.182, ease: "none" }, 0);

      // the circle pops slightly larger and settles on each cut: a pure
      // function of scene time, driven through one proxy tween so every
      // frame is identical no matter the seek order
      const popProxy = { p: 0 };
      const popScale = (t) => {
        for (let i = 1; i < 9; i++) {
          const dt = t - i * CUT;
          if (dt >= 0 && dt < 0.16) {
            const k = 1 - dt / 0.16;
            return 1 + 0.045 * k * k;
          }
        }
        return 1;
      };
      tl.to(
        popProxy,
        {
          p: 1,
          duration: 8.182,
          ease: "none",
          onUpdate: () => {
            gsap.set("#s-pop", { scale: popScale(popProxy.p * 8.182) });
          },
        },
        0,
      );

      SHOTS.forEach((shot, i) => {
        const at = i * CUT;
        const wrap = "#s-w" + i;
        // 1.07x the listed zoom, easing back to it over the shot, focal
        // point held at the window center
        const fromS = shot.z * 1.07;
        tl.fromTo(
          wrap,
          {
            scale: fromS,
            x: 300 - shot.fx * 1080 * fromS,
            y: 300 - shot.fy * 1080 * fromS,
          },
          {
            scale: shot.z,
            x: 300 - shot.fx * 1080 * shot.z,
            y: 300 - shot.fy * 1080 * shot.z,
            duration: CUT,
            ease: "power1.out",
          },
          at,
        );
        // label: left of the slash first, then the right
        tl.fromTo("#s-l" + i + " .sl", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, at + 0.03);
        tl.fromTo("#s-l" + i + " .ss", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at + 0.2);
        tl.fromTo("#s-l" + i + " .sr", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, at + 0.28);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["sonar"] = tl;
    }

    build();
  }
</script>
