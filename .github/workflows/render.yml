name: Render long-form video

on:
  workflow_dispatch:
  push:
    tags:
      - "render-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: longform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          command -v ffmpeg

      - name: Render all eight segments
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          for i in 0 1 2 3 4 5 6 7; do
            echo "=== segment $i ==="
            node tools/capture.mjs video renders/seg_$i.mp4 --segment=$i/8 --long --noaudio --720
          done
          ls -lh renders

      - name: Concatenate, mux and encode
        run: |
          set -euo pipefail
          : > renders/list.txt
          for i in 0 1 2 3 4 5 6 7; do echo "file 'seg_$i.mp4'" >> renders/list.txt; done
          ffmpeg -v error -y -f concat -safe 0 -i renders/list.txt -i data/mix.m4a \
            -map 0:v -map 1:a \
            -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -shortest -movflags +faststart \
            renders/final.mp4
          ls -lh renders/final.mp4
          stat -c 'final bytes: %s' renders/final.mp4

      - name: Publish the finished film
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s renders/final.mp4)
          echo "size bytes: $SIZE"
          if [ "$SIZE" -ge 95000000 ]; then
            echo "too large for git; compressing further"
            ffmpeg -v error -y -i renders/final.mp4 -c:v libx264 -preset veryfast -crf 28 \
              -c:a aac -b:a 128k -movflags +faststart renders/final_small.mp4
            mv renders/final_small.mp4 renders/final.mp4
            SIZE=$(stat -c%s renders/final.mp4)
          fi
          git config user.name ci
          git config user.email ci@local
          git add -f renders/final.mp4
          git commit -m "final film ($SIZE bytes)" || true
          git push -f origin HEAD:refs/heads/final-video
